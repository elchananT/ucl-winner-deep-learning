[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ucl"
version = "0.1.0"
description = "Leakage-safe match-outcome models and Monte-Carlo forecasts for the UEFA Champions League"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Elchanan Treistman" }]
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "tensorflow>=2.16",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyter", "nbconvert", "ipykernel", "nbformat"]

[project.scripts]
ucl-data = "ucl.data:main"
ucl-predict = "ucl.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ucl = ["checksums.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["data: needs the downloaded dataset (run `make data`)"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # E501: left to `ruff format`
